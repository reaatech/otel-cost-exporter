global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-cost-exporter'
    static_configs:
      - targets: ['otel-cost-exporter:8888']
        labels:
          service: 'cost-exporter'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'collector'
