services:
  otel-cost-exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - 'serve'
      - '--port=8888'
      - '--metrics-port=8889'
    environment:
      - NODE_ENV=development
      - OTEL_COST_METRICS_PREFIX=llm_cost
      - OTEL_COST_EXPORT_FORMAT=prometheus
      - OTEL_COST_PRICING_AUTO_UPDATE=false
    ports:
      - '8888:8888'
      - '8889:8889'
    networks:
      - otel-cost

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ./deployments/docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'
      - '4318:4318'
      - '13133:13133'
    depends_on:
      - jaeger
    networks:
      - otel-cost

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686'
    networks:
      - otel-cost

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deployments/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    depends_on:
      - otel-cost-exporter
    networks:
      - otel-cost

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - otel-cost

networks:
  otel-cost:
    driver: bridge
